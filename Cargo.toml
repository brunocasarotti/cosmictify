[package]
name = "cosmictify"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Spotify control applet for the COSMIC desktop"
repository = "https://github.com/brunocasarotti/cosmictify"

[dependencies]
base64 = "0.22"
form_urlencoded = "1.2"
i18n-embed-fl = "0.10"
# Linux Secret Service credential store. `default-features = false` keeps the
# build free of every platform backend; `v1` exposes the simple Entry API and
# `zbus-secret-service-keyring-store` is the Linux Secret Service backend.
# Cosmictify only targets the COSMIC desktop on Linux, so no other backends are
# compiled in.
keyring = { version = "4.1.5", default-features = false, features = [
    "v1",
    "zbus-secret-service-keyring-store",
] }
rand = "0.8"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.52.0", features = ["full"] }
url = "2"
mpris = "2.0.1"
ureq = { version = "2.12", default-features = true }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Required so the panel window grows with cover + marquee text
    "autosize",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]
